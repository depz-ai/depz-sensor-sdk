[package]
name = "depz-sensor-sdk"
version = "0.8.0"
edition = "2021"
description = "Contract-first Rust SDK for the DEPZ USB sensor line (SR04, VL53L4CD ToF, VL53L8CX/CH ToF, TMF8829 dToF, BNO086 IMU) — live devices over the USB serial port, record / replay, protocol codecs, and sensor decode."
license = "MIT"
repository = "https://github.com/depz-ai/depz-sensor-sdk"
homepage = "https://github.com/depz-ai/depz-sensor-sdk"
readme = "README.md"
keywords = ["depz", "sensor", "vl53l8", "bno086", "tof"]
categories = ["embedded", "hardware-support", "parser-implementations"]
exclude = ["tests", "docs", "scripts"]

[lib]
name = "depz_sensor_sdk"
path = "src/lib.rs"

[dependencies]
serialport = "4"

[dev-dependencies]
serde_json = "1"

# Differential-testing adapter (contracts/16_DIFFTEST.md), test-only: lives in
# tests/ (excluded from the package), uses the dev-dependencies, is built by
# `cargo test`. Started by scripts/difftest.py.
[[example]]
name = "difftest_adapter"
path = "tests/difftest/adapter.rs"
